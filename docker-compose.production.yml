services:
  everafter:
    build: .
    # Defaults to the real production secret file. The override supports safe
    # local validation with .env.production.example.
    env_file: ${EVERAFTER_ENV_FILE:-.env.production}
    volumes:
      - ./data:/data
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - everafter
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
